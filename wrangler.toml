# Cloudflare Workers settings (the page is served as static assets, /api/* runs worker/index.js).
# Deploy command: npx wrangler deploy      (the build step below runs automatically)
name = "gemini-workshop"
main = "worker/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true            # do not wipe variables you added in the Cloudflare dashboard

[build]
command = "node scripts/build-cloudflare.js"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"   # /register, /login, /staff ... all open index.html

[triggers]
crons = ["0 8 * * *"]
