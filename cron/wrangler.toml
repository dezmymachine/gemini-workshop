# Deploy with: cd cron && npx wrangler deploy
# Then add the secret:  npx wrangler secret put CRON_SECRET   (same value as on the Pages project)
name = "gemini-workshop-reminders"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
SITE_URL = "https://YOUR-DOMAIN"   # change to your real address, for example https://workshop.example.com

[triggers]
crons = ["0 8 * * *"]   # every day at 08:00 UTC (= Ghana time)
